# Optional: requires KEDA (https://keda.sh). Scales workers on the Redis ready-queue length.
# Delete the worker HorizontalPodAutoscaler first; KEDA manages its own HPA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agentos-worker
  namespace: agentos
spec:
  scaleTargetRef:
    name: agentos-worker
  minReplicaCount: 2
  maxReplicaCount: 30
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        address: redis.internal:6379   # your Redis endpoint; add authenticationRef for passwords/TLS
        listName: agentos:jobs:ready
        # one replica per 16 waiting jobs (each worker runs 8 tasks concurrently)
        listLength: "16"
