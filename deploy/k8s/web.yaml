apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-web
  labels:
    app.kubernetes.io/name: agentos-web
    app.kubernetes.io/part-of: agentos
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: agentos-web }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-web
        app.kubernetes.io/part-of: agentos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/agentos/frontend:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: AGENTOS_API_UPSTREAM, value: "http://agentos-api:8000" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: agentos-web
  labels:
    app.kubernetes.io/name: agentos-web
    app.kubernetes.io/part-of: agentos
spec:
  selector: { app.kubernetes.io/name: agentos-web }
  ports:
    - { name: http, port: 80, targetPort: http }
