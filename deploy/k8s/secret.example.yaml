# Template only; it is not part of kustomization.yaml. Create the real secret out of band, e.g.
#   kubectl -n agentos create secret generic agentos-secrets \
#     --from-literal=AGENTOS_DATABASE_URL=postgresql+asyncpg://agentos:...@db.internal:5432/agentos \
#     --from-literal=AGENTOS_REDIS_URL=rediss://:...@redis.internal:6379/0 \
#     --from-literal=AGENTOS_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=AGENTOS_SECRETS_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: agentos-secrets
type: Opaque
stringData:
  AGENTOS_DATABASE_URL: postgresql+asyncpg://agentos:CHANGE_ME@postgres:5432/agentos
  AGENTOS_REDIS_URL: redis://redis:6379/0
  AGENTOS_JWT_SECRET: CHANGE_ME_TO_64_RANDOM_HEX_CHARS
  AGENTOS_SECRETS_KEY: CHANGE_ME_TO_A_FERNET_KEY
  AGENTOS_OPENAI_API_KEY: ""
  AGENTOS_ANTHROPIC_API_KEY: ""
