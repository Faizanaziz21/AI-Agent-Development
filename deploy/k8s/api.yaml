apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/part-of: agentos
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: agentos-api }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-api
        app.kubernetes.io/part-of: agentos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: agentos-api }
      containers:
        - name: api
          image: ghcr.io/agentos/backend:latest
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: agentos-config }
            - secretRef: { name: agentos-secrets }
          env:
            # The API plans, schedules and serves; agent execution happens in the worker deployment.
            - { name: AGENTOS_EMBEDDED_WORKERS, value: "0" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: objects, mountPath: /data/objects }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: objects
          persistentVolumeClaim: { claimName: agentos-objects }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentos-api
  labels:
    app.kubernetes.io/name: agentos-api
    app.kubernetes.io/part-of: agentos
spec:
  selector: { app.kubernetes.io/name: agentos-api }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentos-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agentos-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentos-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentos-api }
