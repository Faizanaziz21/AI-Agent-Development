# Run before rolling out a new version: kubectl -n agentos apply -f migrate-job.yaml && kubectl -n agentos wait --for=condition=complete job/agentos-migrate
# Argo CD / Flux users can annotate this as a PreSync hook instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentos-migrate
  labels:
    app.kubernetes.io/name: agentos-migrate
    app.kubernetes.io/part-of: agentos
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-migrate
        app.kubernetes.io/part-of: agentos
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/agentos/backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: agentos-config }
            - secretRef: { name: agentos-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
