global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agentos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Every worker replica exposes its own metrics; Docker DNS returns one A record per replica.
  - job_name: agentos-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
