[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS — enterprise multi-agent digital workforce platform (API, orchestrator and workers)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "cryptography>=42",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "numpy>=1.26",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "fakeredis>=2.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E702", "E701"]
